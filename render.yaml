services:
  - type: web
    name: xeroxyt-ntv6-apiv1
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCOUNT_API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_SHARED_SECRET
        sync: false
      - key: REQUIRE_PROXY_SECRET
        value: "true"
